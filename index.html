<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Game</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #111a2e;
      --accent: #7c9cff;
      --accent2: #7ef9c6;
      --text: #edf3ff;
      --danger: #ff6b6b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Arial, sans-serif;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .game-wrap {
      width: min(92vw, 480px);
      background: linear-gradient(180deg, #111a2e 0%, #0d1528 100%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      overflow: hidden;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      font-size: 14px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .score {
      font-weight: 700;
      color: var(--accent2);
    }

    .best {
      color: #dfe7ff;
      opacity: 0.8;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(180deg, #0a1225 0%, #121d35 100%);
      touch-action: none;
      image-rendering: auto;
      border: 0;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px 18px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 14px;
      background: linear-gradient(135deg, var(--accent), #5f7cff);
      color: white;
      box-shadow: 0 10px 18px rgba(124, 156, 255, 0.35);
      cursor: pointer;
    }

    button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="hud">
      <div class="score">Score: <span id="score">0</span></div>
      <div class="best">Best: <span id="best">0</span></div>
    </div>

    <canvas id="game" width="420" height="520" aria-label="Game"></canvas>

    <div class="controls">
      <button id="restartBtn">Restart</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const restartBtn = document.getElementById('restartBtn');

    let best = Number(localStorage.getItem('bestGameScore') || 0);

    const state = {
      running: true,
      score: 0,
      player: {
        x: canvas.width / 2 - 25,
        y: canvas.height - 70,
        w: 50,
        h: 18,
        speed: 5
      },
      bullets: [],
      enemies: [],
      particles: [],
      lastShot: 0,
      spawnTimer: 0,
      gameOver: false
    };

    function resetGame() {
      state.running = true;
      state.score = 0;
      state.bullets = [];
      state.enemies = [];
      state.particles = [];
      state.lastShot = 0;
      state.spawnTimer = 0;
      state.gameOver = false;
      state.player.x = canvas.width / 2 - 25;
      state.player.y = canvas.height - 70;
      scoreEl.textContent = '0';
    }

    function spawnEnemy() {
      const size = 18 + Math.random() * 18;
      state.enemies.push({
        x: Math.random() * (canvas.width - size),
        y: -size,
        w: size,
        h: size,
        speed: 1.5 + Math.random() * 2.2
      });
    }

    function shoot() {
      if (!state.running) return;
      const now = performance.now();
      if (now - state.lastShot < 220) return;

      state.lastShot = now;
      const bulletX = state.player.x + state.player.w / 2 - 3;
      const bulletY = state.player.y - 12;

      state.bullets.push({
        x: bulletX,
        y: bulletY,
        w: 6,
        h: 14,
        speed: 7
      });
    }

    function createBurst(x, y, color) {
      for (let i = 0; i < 14; i++) {
        state.particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 26 + Math.random() * 20,
          color
        });
      }
    }

    function updateParticles() {
      state.particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
      });

      state.particles = state.particles.filter(p => p.life > 0);
    }

    function update() {
      if (!state.running) return;

      state.score += 0.12;
      scoreEl.textContent = Math.floor(state.score);

      state.spawnTimer += 1;
      if (state.spawnTimer > 50) {
        spawnEnemy();
        state.spawnTimer = 0;
      }

      const left = keys['ArrowLeft'] || keys['a'] || keys['A'];
      const right = keys['ArrowRight'] || keys['d'] || keys['D'];

      if (left) state.player.x -= state.player.speed;
      if (right) state.player.x += state.player.speed;

      state.player.x = Math.max(0, Math.min(canvas.width - state.player.w, state.player.x));

      state.bullets.forEach(b => {
        b.y -= b.speed;
      });

      state.enemies.forEach(e => {
        e.y += e.speed;
      });

      for (let i = state.bullets.length - 1; i >= 0; i--) {
        const b = state.bullets[i];
        if (b.y < -20) state.bullets.splice(i, 1);
      }

      for (let i = state.enemies.length - 1; i >= 0; i--) {
        const e = state.enemies[i];
        if (e.y > canvas.height + 20) {
          state.enemies.splice(i, 1);
          continue;
        }

        for (let j = state.bullets.length - 1; j >= 0; j--) {
          const b = state.bullets[j];
          if (
            b.x < e.x + e.w &&
            b.x + b.w > e.x &&
            b.y < e.y + e.h &&
            b.y + b.h > e.y
          ) {
            state.enemies.splice(i, 1);
            state.bullets.splice(j, 1);
            createBurst(e.x + e.w / 2, e.y + e.h / 2, '#7ef9c6');
            state.score += 10;
            break;
          }
        }
      }

      for (let i = state.enemies.length - 1; i >= 0; i--) {
        const e = state.enemies[i];
        if (
          state.player.x < e.x + e.w &&
          state.player.x + state.player.w > e.x &&
          state.player.y < e.y + e.h &&
          state.player.y + state.player.h > e.y
        ) {
          state.running = false;
          state.gameOver = true;

          if (Math.floor(state.score) > best) {
            best = Math.floor(state.score);
            localStorage.setItem('bestGameScore', String(best));
          }

          bestEl.textContent = String(best);
          createBurst(state.player.x + state.player.w / 2, state.player.y + state.player.h / 2, '#ff6b6b');
          break;
        }
      }

      updateParticles();
    }

    function drawBackground() {
      ctx.fillStyle = '#0a1225';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      for (let i = 0; i < 12; i++) {
        const x = (i * 40) % canvas.width;
        const y = (i * 70) % canvas.height;
        ctx.fillRect(x, y, 2, 2);
      }
    }

    function drawPlayer() {
      ctx.fillStyle = '#7c9cff';
      ctx.fillRect(state.player.x, state.player.y, state.player.w, state.player.h);
    }

    function drawBullets() {
      ctx.fillStyle = '#7ef9c6';
      state.bullets.forEach(b => {
        ctx.fillRect(b.x, b.y, b.w, b.h);
      });
    }

    function drawEnemies() {
      ctx.fillStyle = '#ff6b6b';
      state.enemies.forEach(e => {
        ctx.fillRect(e.x, e.y, e.w, e.h);
      });
    }

    function drawParticles() {
      state.particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 30);
        ctx.fillRect(p.x, p.y, 4, 4);
        ctx.globalAlpha = 1;
      });
    }

    function drawGameOver() {
      if (!state.gameOver) return;

      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 30px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 10);

      ctx.font = '18px Arial';
      ctx.fillStyle = '#dfe7ff';
      ctx.fillText('Tap restart to play again', canvas.width / 2, canvas.height / 2 + 24);
    }

    function render() {
      drawBackground();
      drawParticles();
      drawPlayer();
      drawBullets();
      drawEnemies();
      drawGameOver();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key === ' ') {
        e.preventDefault();
        shoot();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (!state.running) {
        resetGame();
      } else {
        shoot();
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!state.running) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width * canvas.width;
      state.player.x = x - state.player.w / 2;
    });

    restartBtn.addEventListener('click', () => {
      resetGame();
    });

    bestEl.textContent = String(best);
    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
